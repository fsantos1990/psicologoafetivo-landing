<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Painel de pacientes</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pacientes/base.css">
<style>
body{font-size:16px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.pac{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.pac:last-child{border-bottom:0}
.pac a.nm{font-weight:700;text-decoration:none;color:var(--ink)}
.pac a.nm:hover{color:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.cols th,.cols td{padding:6px 3px;font-size:13px}
.serie{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mini .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.mini .t b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.mini svg{width:100%;height:auto;display:block;margin-top:4px}
.mini .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.mini .pt{fill:var(--accent);stroke:#fff;stroke-width:2}
.mini .ax{stroke:var(--line);stroke-width:1}
.mini .tk{font-size:10px;fill:var(--muted)}
.de{color:var(--muted);text-decoration:line-through}
.logl{border-bottom:1px solid var(--line);padding:10px 0}
.logl:last-child{border-bottom:0}
.logl ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.logl li{margin-bottom:4px;overflow-wrap:anywhere}
</style>
<script src="/avaliacao/config.js"></script>
<script src="/pacientes/instrumentos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap wide">
<header class="top"><h1 style="margin:0;font-size:24px">Pacientes</h1><div class="noprint small" id="who"></div></header>
<div id="app"></div>
</div>
<script>
(function(){
"use strict";
var CFG = window.AVALIACAO_CONFIG, I = window.Instrumentos, C = I.CHECKIN, V = I.VALORES, esc = I.esc;
var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
var app = document.getElementById("app"), ORIGEM = location.origin;
var RE = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;
function fmt(d){ return new Date(d).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}); }
function dia(d){ return new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}); }
function copiar(sel){ app.querySelectorAll(sel || "[data-copy]").forEach(function(b){ b.onclick = function(){ navigator.clipboard.writeText(b.dataset.copy).then(function(){ var t = b.textContent; b.textContent = "Copiado"; setTimeout(function(){ b.textContent = t; }, 1500); }); }; }); }
function linkCheckin(p){ return ORIGEM + "/checkin/?e=" + encodeURIComponent(p.email) + "&n=" + encodeURIComponent(p.nome); }
function wa(txt){ return "https://wa.me/?text=" + encodeURIComponent(txt); }

// ---------- login ----------
function loginView(msg){
  document.getElementById("who").innerHTML = "";
  app.innerHTML = '<div class="card" style="max-width:420px"><h2>Entrar</h2><p class="muted">Você recebe um link de acesso no e-mail cadastrado.</p>'+
    '<form id="lf"><input type="email" id="em" value="'+esc(CFG.EMAIL_TERAPEUTA)+'" required><p></p><button class="btn" type="submit">Enviar link de acesso</button></form>'+
    (msg?'<p class="muted" style="margin-top:10px">'+esc(msg)+'</p>':'')+'</div>';
  document.getElementById("lf").onsubmit = function(e){
    e.preventDefault();
    sb.auth.signInWithOtp({ email: document.getElementById("em").value.trim(), options: { shouldCreateUser: false, emailRedirectTo: ORIGEM + "/pacientes/" } })
      .then(function(r){ loginView(r.error ? "Erro: " + r.error.message : "Link enviado. Abra o e-mail neste mesmo navegador."); });
  };
}
function naoAutorizado(email){
  app.innerHTML = '<div class="msg warn">O e-mail '+esc(email)+' não tem acesso a este painel.</div>';
}

// ---------- lista de pacientes ----------
function listaView(){
  app.innerHTML =
    '<div class="card noprint"><h2>Cadastrar paciente</h2>'+
    '<form id="np" class="row"><label class="f" style="margin:0">Nome<input type="text" id="pn" maxlength="80" required></label>'+
    '<label class="f" style="margin:0">E-mail<input type="email" id="pe" maxlength="120" required></label>'+
    '<button class="btn" type="submit">Cadastrar</button></form><div id="npm"></div>'+
    '<p class="muted small" style="margin:10px 0 0">O cadastro libera o mapa de valores para esse e-mail e gera o link pessoal do check-in. O check-in aceita envios de qualquer e-mail; os que não estão cadastrados aparecem separados abaixo.</p></div>'+
    '<div class="card"><h2>Pacientes</h2><div id="lst" class="muted">Carregando…</div></div>'+
    '<div id="avulsos"></div>'+
    '<p class="muted small noprint"><a href="/avaliacao/painel/">Painel das avaliações de casal</a></p>';

  document.getElementById("np").onsubmit = function(e){
    e.preventDefault();
    var nome = document.getElementById("pn").value.trim(), email = document.getElementById("pe").value.trim().toLowerCase(), out = document.getElementById("npm");
    if (!nome || !RE.test(email)) { out.innerHTML = '<p class="msg err" style="margin-top:10px">Confira o nome e o e-mail.</p>'; return; }
    sb.from("pacientes").insert({ email: email, nome: nome }).then(function(r){
      if (r.error) { out.innerHTML = '<p class="msg err" style="margin-top:10px">'+esc(r.error.code === "23505" ? "Este e-mail já está cadastrado." : r.error.message)+'</p>'; return; }
      listaView();
    });
  };

  Promise.all([
    sb.from("pacientes").select("*").order("nome"),
    sb.from("checkins").select("id,email,nome,criado_em,lido").order("criado_em",{ascending:false}).limit(2000),
    sb.from("valores_mapas").select("email,atualizado_em")
  ]).then(function(rs){
    var el = document.getElementById("lst"), err = rs[0].error || rs[1].error || rs[2].error;
    if (err) { el.textContent = "Erro: " + err.message; return; }
    var pac = rs[0].data, ck = {}, mapas = {}, cad = {};
    rs[1].data.forEach(function(c){ (ck[c.email] = ck[c.email] || []).push(c); });
    rs[2].data.forEach(function(m){ mapas[m.email] = m.atualizado_em; });
    pac.forEach(function(p){ cad[p.email] = 1; });
    el.classList.remove("muted");
    el.innerHTML = pac.length ? pac.map(function(p){
      var c = ck[p.email] || [], novos = c.filter(function(x){ return !x.lido; }).length, lk = linkCheckin(p);
      return '<div class="pac"><div><a class="nm" href="?p='+encodeURIComponent(p.email)+'">'+esc(p.nome)+'</a> '+
        (p.ativo?'':'<span class="pill off">inativo</span> ')+(novos?'<span class="pill unread">'+novos+' novo(s)</span>':'')+
        '<div class="muted small">'+esc(p.email)+' · '+(c.length ? c.length+' check-in(s), último em '+dia(c[0].criado_em) : 'sem check-ins')+
        ' · '+(mapas[p.email] ? 'mapa salvo em '+dia(mapas[p.email]) : 'mapa não preenchido')+'</div></div>'+
        '<div class="acts noprint"><button class="btn sm alt" data-copy="'+esc(lk)+'">Copiar link do check-in</button>'+
        '<a class="btn sm alt" target="_blank" rel="noopener" href="'+wa("Olá, "+p.nome.split(" ")[0]+". Este é o seu link do check-in semanal (leva uns 2 minutos): "+lk)+'">WhatsApp</a>'+
        '<a class="btn sm" href="?p='+encodeURIComponent(p.email)+'">Abrir</a></div></div>';
    }).join("") : '<p class="muted">Nenhum paciente cadastrado ainda.</p>';
    copiar();

    var av = Object.keys(ck).filter(function(e){ return !cad[e]; });
    if (av.length) {
      document.getElementById("avulsos").innerHTML = '<div class="card"><h2>Check-ins de e-mails não cadastrados</h2><p class="muted small">Pode ser um paciente que digitou outro e-mail, ou um envio indevido.</p>'+
        av.map(function(e){ var c = ck[e]; return '<div class="pac"><div><a class="nm" href="?p='+encodeURIComponent(e)+'">'+esc(c[0].nome)+'</a> <span class="pill warn">não cadastrado</span><div class="muted small">'+esc(e)+' · '+c.length+' check-in(s), último em '+dia(c[0].criado_em)+'</div></div><a class="btn sm" href="?p='+encodeURIComponent(e)+'">Abrir</a></div>'; }).join("")+'</div>';
    }
  });
}

// ---------- evolução (um gráfico pequeno por escala, mesmo eixo 0–10) ----------
function mini(s, pts){
  var W = 240, H = 78, L = 16, R = 8, T = 8, B = 16, pw = W - L - R, ph = H - T - B, n = pts.length;
  function x(i){ return n === 1 ? L + pw/2 : L + (i/(n-1))*pw; }
  function y(v){ return T + (1 - v/10)*ph; }
  var ult = pts[n-1], g = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(s.curto)+' ao longo das semanas">'+
    '<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'"/><line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(10)+'" y2="'+y(10)+'" stroke-dasharray="2 3"/>'+
    '<text class="tk" x="0" y="'+(y(0)+3)+'">0</text><text class="tk" x="0" y="'+(y(10)+3)+'">10</text>';
  if (n > 1) g += '<polyline class="ln" points="'+pts.map(function(p,i){ return x(i)+","+y(p.v); }).join(" ")+'"/>';
  pts.forEach(function(p,i){ g += '<circle class="pt" cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(i===n-1?4.5:3)+'"><title>'+dia(p.d)+': '+p.v+'</title></circle>'; });
  g += '<text class="tk" x="'+L+'" y="'+(H-3)+'">'+dia(pts[0].d)+'</text>'+(n>1?'<text class="tk" text-anchor="end" x="'+(W-R)+'" y="'+(H-3)+'">'+dia(ult.d)+'</text>':'')+'</svg>';
  return '<div class="mini"><div class="t"><span>'+esc(s.curto)+' <span class="small">('+(s.bomAlto?"maior é melhor":"menor é melhor")+')</span></span><b>'+ult.v+'</b></div>'+g+'</div>';
}

function checkinHTML(c){
  var R = c.respostas || {}, emo = (R.emocoes || []).concat(R.emocao_outra ? [R.emocao_outra] : []);
  var h = '<div class="card"><h2>'+fmt(c.criado_em)+' '+(c.lido?'':'<span class="pill unread">novo</span>')+'</h2>'+
    '<div class="scroll"><table><tr>'+C.escalas.map(function(s){ return '<th class="n">'+esc(s.curto)+'</th>'; }).join("")+'</tr><tr>'+
    C.escalas.map(function(s){ return '<td class="n"><b>'+(R[s.id]==null?"–":esc(R[s.id]))+'</b></td>'; }).join("")+'</tr></table></div>'+
    '<h3>Emoções</h3><p>'+(emo.length ? emo.map(function(e){ return '<span class="tag">'+esc(e)+'</span>'; }).join("") : '<span class="muted">Nenhuma marcada.</span>')+'</p>';
  C.textos.forEach(function(t){ if (R[t.id]) h += '<h3>'+esc(t.pt)+'</h3><div class="text">'+esc(R[t.id])+'</div>'; });
  h += '<p class="noprint acts" style="margin:12px 0 0">'+(c.lido?'':'<button class="btn sm alt" data-lido="'+c.id+'">Marcar como lido</button>')+'<button class="btn sm danger" data-del="'+c.id+'">Apagar</button></p></div>';
  return h;
}

function valorTxt(v){ return v == null ? '<span class="muted">(vazio)</span>' : esc(v); }
function logHTML(l){
  var m = l.mudancas || {}, ks = Object.keys(m);
  var titulo = { criou: "Criou o mapa", alterou: "Alterou", apagou: "Mapa apagado" }[l.acao] || l.acao;
  var h = '<div class="logl"><b>'+fmt(l.em)+'</b> · '+titulo+(ks.length ? ' <span class="muted small">('+ks.length+' campo(s))</span>' : '')+
    (l.autor && l.autor !== l.email ? ' <span class="muted small">por '+esc(l.autor)+'</span>' : '');
  if (ks.length) h += '<ul>'+ks.sort().map(function(k){
    return '<li><b>'+esc(I.nomeCampo(k))+':</b> '+(l.acao === "criou" ? valorTxt(m[k].para) : '<span class="de">'+valorTxt(m[k].de)+'</span> → '+valorTxt(m[k].para))+'</li>'; }).join("")+'</ul>';
  return h + '</div>';
}

function mapaLeitura(m){
  var D = m.dados || {}, d = I.distancias(D);
  var h = '<p class="muted small">Última alteração em '+fmt(m.atualizado_em)+'</p>' + I.mapaHTML(D);
  if (d.length) h += '<p class="small" style="margin-top:10px"><b>Maiores distâncias (importância ≥ 7, vivência 3+ abaixo):</b> '+d.map(function(x){ return esc(x.a.pt)+" ("+x.imp+" → "+x.acao+")"; }).join("; ")+'</p>';
  V.areas.forEach(function(a){
    var t = D[a.id+"_txt"], p = D[a.id+"_passo"];
    if (!t && !p) return;
    h += '<h3>'+esc(a.pt)+'</h3>'+(t?'<div class="text">'+esc(t)+'</div>':'')+(p?'<div class="text"><b>Passo:</b> '+esc(p)+'</div>':'');
  });
  return h;
}

// ---------- um paciente ----------
function pacienteView(email){
  app.innerHTML = '<p class="noprint"><a href="./">← Todos os pacientes</a> · <a href="#" id="pr">Imprimir / salvar PDF</a></p><div id="pv" class="muted">Carregando…</div>';
  document.getElementById("pr").onclick = function(e){ e.preventDefault(); window.print(); };
  Promise.all([
    sb.from("pacientes").select("*").eq("email", email).maybeSingle(),
    sb.from("checkins").select("*").eq("email", email).order("criado_em",{ascending:true}).limit(500),
    sb.from("valores_mapas").select("*").eq("email", email).maybeSingle(),
    sb.from("valores_log").select("id,em,autor,email,acao,mudancas").eq("email", email).order("em",{ascending:false}).limit(300)
  ]).then(function(rs){
    var pv = document.getElementById("pv"), err = rs[0].error || rs[1].error || rs[2].error || rs[3].error;
    if (err) { pv.textContent = "Erro: " + err.message; return; }
    var p = rs[0].data, cks = rs[1].data, mapa = rs[2].data, log = rs[3].data;
    var nome = p ? p.nome : (cks.length ? cks[cks.length-1].nome : email);
    pv.classList.remove("muted");
    var h = '<h2 style="font-size:26px;margin-bottom:2px">'+esc(nome)+'</h2><p class="muted">'+esc(email)+(p ? (p.ativo ? '' : ' · <span class="pill off">inativo</span>') : ' · <span class="pill warn">não cadastrado</span>')+'</p>';

    if (p) {
      var lk = linkCheckin(p), lv = ORIGEM + "/valores/";
      h += '<div class="card noprint"><h2>Links e acesso</h2><div class="acts">'+
        '<button class="btn sm alt" data-copy="'+esc(lk)+'">Copiar link do check-in</button>'+
        '<a class="btn sm alt" target="_blank" rel="noopener" href="'+wa("Olá, "+p.nome.split(" ")[0]+". Este é o seu link do check-in semanal (leva uns 2 minutos): "+lk)+'">Check-in por WhatsApp</a>'+
        '<button class="btn sm alt" data-copy="'+esc(lv)+'">Copiar link do mapa de valores</button>'+
        '<a class="btn sm alt" target="_blank" rel="noopener" href="'+wa("Olá, "+p.nome.split(" ")[0]+". Este é o exercício do mapa de valores. Entre com o e-mail "+p.email+" e você recebe um link de acesso: "+lv)+'">Mapa por WhatsApp</a>'+
        '<button class="btn sm alt" id="tg">'+(p.ativo?"Desativar acesso":"Reativar acesso")+'</button>'+
        '<button class="btn sm danger" id="rm">Remover cadastro</button></div>'+
        '<p class="muted small" style="margin:10px 0 0">Desativar bloqueia o mapa de valores para este e-mail e mantém todos os dados. Remover o cadastro não apaga check-ins nem o mapa; apague-os abaixo se for o caso.</p></div>';
    }

    h += '<h2 style="margin-top:22px">Check-in semanal</h2>';
    if (cks.length) {
      h += '<div class="card"><h3 style="margin-top:0">Evolução ('+cks.length+' envio(s))</h3><div class="serie">'+C.escalas.map(function(s){
        var pts = cks.filter(function(c){ return c.respostas && c.respostas[s.id] != null; }).map(function(c){ return { d: c.criado_em, v: Number(c.respostas[s.id]) }; });
        return pts.length ? mini(s, pts) : ""; }).join("")+'</div>'+
        '<details class="tabela" style="margin-top:10px"><summary>Ver em tabela</summary><div class="scroll"><table><tr><th>Data</th>'+C.escalas.map(function(s){ return '<th class="n">'+esc(s.curto)+'</th>'; }).join("")+'</tr>'+
        cks.slice().reverse().map(function(c){ return '<tr><td>'+dia(c.criado_em)+'</td>'+C.escalas.map(function(s){ var v = (c.respostas||{})[s.id]; return '<td class="n">'+(v==null?"–":esc(v))+'</td>'; }).join("")+'</tr>'; }).join("")+'</table></div></details></div>';
      h += '<div class="cols">'+cks.slice().reverse().map(checkinHTML).join("")+'</div>';
    } else h += '<p class="muted">Nenhum check-in recebido.</p>';

    h += '<h2 style="margin-top:22px">Mapa de valores</h2>';
    if (mapa) h += '<div class="card">'+mapaLeitura(mapa)+'<p class="noprint" style="margin:14px 0 0"><button class="btn sm danger" id="dm">Apagar o mapa</button></p></div>';
    else h += '<p class="muted">'+(p ? "Ainda não preenchido." : "Disponível só para pacientes cadastrados.")+'</p>';
    if (log.length) h += '<div class="card"><h2>Histórico de alterações do mapa</h2><p class="muted small">Registro automático do banco a cada gravação. Não pode ser editado pelo paciente nem por este painel.</p>'+log.map(logHTML).join("")+'</div>';

    pv.innerHTML = h;
    copiar();
    function de_novo(r){ if (r && r.error) alert(r.error.message); pacienteView(email); }
    pv.querySelectorAll("[data-lido]").forEach(function(b){ b.onclick = function(){ sb.from("checkins").update({lido:true}).eq("id", b.dataset.lido).then(de_novo); }; });
    pv.querySelectorAll("[data-del]").forEach(function(b){ b.onclick = function(){
      if (confirm("Apagar definitivamente este check-in? Não há como desfazer.")) sb.from("checkins").delete().eq("id", b.dataset.del).then(de_novo); }; });
    var tg = document.getElementById("tg"), rm = document.getElementById("rm"), dm = document.getElementById("dm");
    if (tg) tg.onclick = function(){ sb.from("pacientes").update({ ativo: !p.ativo }).eq("email", email).then(de_novo); };
    if (rm) rm.onclick = function(){ if (confirm("Remover o cadastro de "+p.nome+"? O mapa de valores fica bloqueado para este e-mail.")) sb.from("pacientes").delete().eq("email", email).then(function(r){ if (r.error) alert(r.error.message); location.href = "./"; }); };
    if (dm) dm.onclick = function(){ if (confirm("Apagar definitivamente o mapa de valores deste paciente? O histórico registra a exclusão.")) sb.from("valores_mapas").delete().eq("email", email).then(de_novo); };
  });
}

var aberto = false;
function route(session){
  if (!session){ aberto = false; loginView(); return; }
  if (aberto) return; aberto = true;
  var em = (session.user.email || "").toLowerCase();
  document.getElementById("who").innerHTML = '<span class="muted">'+esc(em)+'</span> <button class="btn sm alt" id="out">Sair</button>';
  document.getElementById("out").onclick = function(){ sb.auth.signOut().then(function(){ aberto = false; loginView(); }); };
  if (em !== String(CFG.EMAIL_TERAPEUTA).toLowerCase()) { naoAutorizado(em); return; }
  var p = new URLSearchParams(location.search).get("p");
  if (p) pacienteView(p.toLowerCase()); else listaView();
}
sb.auth.getSession().then(function(r){ route(r.data.session); });
sb.auth.onAuthStateChange(function(ev, s){ if (ev === "SIGNED_IN") setTimeout(function(){ route(s); }, 0); });
})();
</script>
</body>
</html>
