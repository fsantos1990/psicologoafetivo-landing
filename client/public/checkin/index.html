<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Check-in semanal | Felipe Santos, Psicólogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pacientes/base.css">
<script src="/avaliacao/config.js"></script>
<script src="/pacientes/instrumentos.js"></script>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">Felipe Santos · Psicólogo</div></header>
<main id="app" aria-live="polite"></main>
</div>
<nav class="nav" id="nav" hidden><div class="in"><button type="button" class="btn" id="send">Enviar check-in</button></div></nav>

<script>
(function(){
"use strict";
var I = window.Instrumentos, C = I.CHECKIN, CFG = window.AVALIACAO_CONFIG || {}, esc = I.esc;
var app = document.getElementById("app"), nav = document.getElementById("nav"), send = document.getElementById("send");
var RE = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;

// link pessoal (?e=email&n=nome) preenche a identificação; depois o endereço é limpo para o e-mail não ficar na barra
var qs = new URLSearchParams(location.search), salvo = {};
try { salvo = JSON.parse(localStorage.getItem("checkin_quem") || "{}") || {}; } catch (e) {}
var quem = { email: (qs.get("e") || salvo.email || "").trim().toLowerCase(), nome: (qs.get("n") || salvo.nome || "").trim() };
if (qs.get("e") || qs.get("n")) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }

function escala(s){
  return '<div class="card esc vazio" data-esc="'+s.id+'"><div class="qt"><label for="r_'+s.id+'">'+esc(s.pt)+'</label><output id="o_'+s.id+'">toque para marcar</output></div>'+
    '<input type="range" id="r_'+s.id+'" min="0" max="10" step="1" value="5" aria-describedby="e_'+s.id+'">'+
    '<div class="ends" id="e_'+s.id+'"><span>0 · '+esc(s.min)+'</span><span>'+esc(s.max)+' · 10</span></div></div>';
}

function form(){
  var h = '<h1>Check-in semanal</h1>'+
    '<p class="muted">Leva uns dois minutos. Responda pensando nos últimos 7 dias. Não existe resposta certa.</p>'+
    '<div id="top"></div>'+
    '<div class="card" id="quem"><label class="f" for="nome">Seu nome</label><input type="text" id="nome" maxlength="80" autocomplete="name" value="'+esc(quem.nome)+'">'+
    '<label class="f" for="email">Seu e-mail</label><input type="email" id="email" maxlength="120" autocomplete="email" inputmode="email" autocapitalize="off" placeholder="seu@email.com" value="'+esc(quem.email)+'">'+
    '<p class="muted small" style="margin:8px 0 0">Use <b>sempre o mesmo e-mail</b>. É ele que junta os seus check-ins e mostra a sua evolução ao longo das semanas.</p></div>';
  h += escala(C.escalas[0]);
  h += '<div class="card"><p style="font-weight:600;margin-bottom:4px">Quais emoções mais apareceram nesta semana?</p><p class="muted small">Marque quantas quiser.</p>'+
    C.emocoes.map(function(g){
      return '<h3 style="margin-top:10px">'+esc(g.grupo)+'</h3><div class="chips">'+g.itens.map(function(e){
        return '<label class="chip"><input type="checkbox" name="emo" value="'+esc(e)+'">'+esc(e)+'</label>'; }).join("")+'</div>';
    }).join("")+
    '<label class="f" for="emo_outra" style="font-weight:400;font-size:15px;margin-top:14px">Outra? Escreva aqui (opcional)</label><input type="text" id="emo_outra" maxlength="80"></div>';
  h += '<h2 style="margin-top:22px">Nesta semana, de 0 a 10</h2>' + C.escalas.slice(1).map(escala).join("");
  h += '<h2 style="margin-top:22px">Em poucas palavras <span class="muted" style="font-weight:400">(opcional)</span></h2>'+
    C.textos.map(function(t){ return '<div class="card"><label class="f" for="t_'+t.id+'">'+esc(t.pt)+'</label><textarea id="t_'+t.id+'" maxlength="1500"></textarea></div>'; }).join("");
  h += '<div class="msg warn"><b>Este formulário não é lido na hora.</b> Eu leio antes da nossa sessão. Se você estiver em crise ou pensando em se machucar, ligue 188 (CVV, 24 horas, gratuito) ou 192 (SAMU), ou vá ao pronto-socorro mais próximo.</div>';
  h += '<div class="card" id="cons"><label class="check"><input type="checkbox" id="ok"><span>Concordo em enviar estas respostas ao meu psicólogo, Felipe Santos, para uso no meu acompanhamento. Só ele tem acesso. Os dados ficam guardados em um serviço de banco de dados com servidores nos Estados Unidos, com acesso protegido. Posso pedir a exclusão quando quiser.</span></label></div>'+
    '<div class="hp" aria-hidden="true"><label>Não preencha<input type="text" id="site" tabindex="-1" autocomplete="off"></label></div>'+
    '<div id="bot"></div>';
  app.innerHTML = h;
  nav.hidden = false;

  app.querySelectorAll(".esc").forEach(function(box){
    var r = box.querySelector("input"), o = box.querySelector("output");
    function marca(){ box.classList.remove("vazio","missing"); box.dataset.ok = "1"; o.textContent = r.value; }
    ["input","change","pointerdown","keydown"].forEach(function(ev){ r.addEventListener(ev, function(){ setTimeout(marca, 0); }); });
  });
  app.querySelectorAll(".chip input").forEach(function(c){ c.onchange = function(){ c.parentNode.classList.toggle("sel", c.checked); }; });
}

function erro(txt, el){
  document.getElementById("bot").innerHTML = '<div class="msg err" role="alert">'+esc(txt)+'</div>';
  if (el) { el.classList.add("missing"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

function enviar(){
  app.querySelectorAll(".missing").forEach(function(x){ x.classList.remove("missing"); });
  var nome = document.getElementById("nome").value.trim(), email = document.getElementById("email").value.trim().toLowerCase();
  if (!nome) return erro("Escreva o seu nome.", document.getElementById("quem"));
  if (!RE.test(email)) return erro("Confira o seu e-mail.", document.getElementById("quem"));
  var R = {}, falta = null;
  C.escalas.forEach(function(s){
    var box = app.querySelector('[data-esc="'+s.id+'"]');
    if (box.dataset.ok) R[s.id] = Number(box.querySelector("input").value); else if (!falta) falta = box;
  });
  if (falta) return erro("Falta marcar uma das notas de 0 a 10. Toque na barra para escolher.", falta);
  R.emocoes = [].map.call(app.querySelectorAll('input[name="emo"]:checked'), function(c){ return c.value; });
  var outra = document.getElementById("emo_outra").value.trim(); if (outra) R.emocao_outra = outra;
  C.textos.forEach(function(t){ var v = document.getElementById("t_"+t.id).value.trim(); if (v) R[t.id] = v; });
  if (!document.getElementById("ok").checked) return erro("Marque a caixa de concordância para enviar.", document.getElementById("cons"));
  if (document.getElementById("site").value) { fim(nome); return; } // robô

  send.disabled = true; send.textContent = "Enviando…";
  fetch(CFG.SUPABASE_URL + "/rest/v1/checkins", {
    method: "POST",
    headers: { "apikey": CFG.SUPABASE_ANON_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
    body: JSON.stringify({ email: email, nome: nome, versao: C.versao, consentimento: true, respostas: R })
  }).then(function(r){
    if (r.ok) { try { localStorage.setItem("checkin_quem", JSON.stringify({ email: email, nome: nome })); } catch (e) {} fim(nome); return; }
    return r.json().catch(function(){ return {}; }).then(function(j){
      throw new Error(/Muitos envios/.test(j.message || "") ? j.message : "Não foi possível enviar agora.");
    });
  }).catch(function(e){
    send.disabled = false; send.textContent = "Enviar check-in";
    erro((e && /Muitos envios/.test(e.message) ? e.message : "Não foi possível enviar agora. Confira a internet e tente de novo.") + " Suas respostas continuam nesta tela.");
  });
}

function fim(nome){
  nav.hidden = true;
  app.innerHTML = '<div class="done"><h1>Recebido. Obrigado, '+esc(nome.split(" ")[0])+'.</h1>'+
    '<p>Seu check-in desta semana foi enviado. A gente conversa sobre ele na sessão.</p>'+
    '<p class="muted">Pode fechar esta página. Na próxima semana, é só abrir o mesmo link.</p></div>';
  window.scrollTo(0, 0);
}

send.onclick = enviar;
form();
})();
</script>
</body>
</html>
